<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Code - CREA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
  :root {
    --bg-light: #f3f4f6;
    --card-bg: #ffffff;
    --text-primary: #1f2937;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    --border-color: #e5e7eb;
    --focus-ring: #111827;
    --btn-primary: #111827;
    --btn-primary-hover: #1f2937;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    --radius: 12px;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  
  .auth-card {
    width: 100%;
    max-width: 420px;
    background-color: var(--card-bg);
    border-radius: var(--radius);
    padding: 40px 32px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .badge-icon {
    width: 48px;
    height: 48px;
    background-color: var(--bg-light);
    color: var(--btn-primary);
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin-bottom: 24px;
  }
  
  .badge-icon .material-symbols-outlined {
    font-size: 24px;
  }
  
  .auth-header {
    text-align: center;
    margin-bottom: 28px;
    width: 100%;
  }
  
  .auth-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  
  .auth-sub {
    font-size: 14px;
    color: var(--text-secondary);
    word-break: break-all;
  }
  
  .auth-form {
    width: 100%;
  }
  
  .otp-container {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 24px;
    width: 100%;
  }
  
  .otp-box {
    flex: 1;
    height: 52px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-primary);
    background-color: #ffffff;
    transition: border-color 0.15s ease;
  }
  
  .otp-box:focus {
    outline: none;
    border-color: var(--focus-ring);
  }
  
  .btn {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
  }
  
  .btn-primary {
    background-color: var(--btn-primary);
    color: #ffffff;
  }
  
  .btn-primary:hover {
    background-color: var(--btn-primary-hover);
  }
  
  .helper-text {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-secondary);
    text-align: center;
  }
  
  .resend-text {
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-secondary);
    text-align: center;
  }
  
  .resend-text a {
    color: var(--focus-ring);
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
  }
  
  .resend-text a:hover {
    text-decoration: underline;
  }
  
  .alert {
    width: 100%;
    background-color: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .alert-success {
    background-color: #f0fdf4;
    border-color: #bbf7d0;
    color: #15803d;
  }
  
  .alert .material-symbols-outlined {
    font-size: 18px;
  }
</style>
</head>
<body>
<div class="auth-card">
  <div class="badge-icon">
    <span class="material-symbols-outlined">mark_email_unread</span>
  </div>
  <div class="auth-header">
    <h2 class="auth-title">Check your email</h2>
    <p class="auth-sub">Enter the code sent to <strong id="user-email-display">{{ email }}</strong></p>
  </div>
  
  <!-- Alert Banner -->
  <div id="alert-banner" class="alert" style="display: none;">
    <span class="material-symbols-outlined" id="alert-icon">error</span>
    <span id="alert-text"></span>
  </div>

  {% if error %}
  <div class="alert" id="server-alert">
    <span class="material-symbols-outlined">error</span>
    <span>{{ error }}</span>
  </div>
  {% endif %}
  
  <form class="auth-form" id="otp-form" method="POST" action="{{ url_for('verify_otp') }}">
    <input type="hidden" name="email" value="{{ email }}">
    <input type="hidden" name="action" value="{{ action }}">
    <input type="hidden" name="name" value="{{ name }}">
    
    <!-- Code inputs container -->
    <div class="otp-container">
      <input type="text" maxlength="1" class="otp-box" required pattern="[0-9]" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" required pattern="[0-9]" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" required pattern="[0-9]" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" required pattern="[0-9]" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" required pattern="[0-9]" inputmode="numeric">
      <input type="text" maxlength="1" class="otp-box" required pattern="[0-9]" inputmode="numeric">
    </div>
    
    <!-- Joined hidden code input for form submission -->
    <input type="hidden" id="full-code" name="code" value="">
    
    <button type="submit" class="btn btn-primary">Verify Code</button>
  </form>
  
  <p class="helper-text">Can't find the email? Check your spam folder.</p>
  
  <p class="resend-text">
    Didn't receive the code? <a id="resend-btn" onclick="resendCode()">Resend code</a>
  </p>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const boxes = document.querySelectorAll('.otp-box');
  const form = document.getElementById('otp-form');
  const fullCodeInput = document.getElementById('full-code');
  const serverAlert = document.getElementById('server-alert');
  
  // Auto-focus first box
  if (boxes.length > 0) {
    boxes[0].focus();
  }
  
  // Backspace and Focus Advance/Reverse Navigation
  boxes.forEach((box, idx) => {
    // Advancing focus on digit entry
    box.addEventListener('input', function(e) {
      const val = e.target.value;
      if (serverAlert) serverAlert.style.display = 'none';
      hideAlert();
      
      // Clean non-digits
      e.target.value = val.replace(/[^0-9]/g, '');
      
      if (e.target.value.length === 1 && idx < boxes.length - 1) {
        boxes[idx + 1].focus();
      }
    });
    
    // Reverse focus on backspace
    box.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && e.target.value.length === 0 && idx > 0) {
        boxes[idx - 1].focus();
      }
    });
    
    // Intercept full-code pasting
    box.addEventListener('paste', function(e) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData('text').trim();
      const cleanDigits = text.replace(/[^0-9]/g, '').slice(0, 6);
      
      if (cleanDigits.length > 0) {
        for (let i = 0; i < cleanDigits.length; i++) {
          if (boxes[i]) {
            boxes[i].value = cleanDigits[i];
          }
        }
        // Focus the last filled box
        const focusIdx = Math.min(cleanDigits.length, boxes.length - 1);
        boxes[focusIdx].focus();
      }
    });
  });
  
  // Assemble final code prior to submit
  form.addEventListener('submit', function(e) {
    let joined = '';
    boxes.forEach(box => {
      joined += box.value;
    });
    if (joined.length !== 6) {
      e.preventDefault();
      showAlert('Please enter the full 6-digit code.', 'error');
      return;
    }
    fullCodeInput.value = joined;
  });
});

function showAlert(msg, type = 'error') {
  const banner = document.getElementById('alert-banner');
  const text = document.getElementById('alert-text');
  const icon = document.getElementById('alert-icon');
  
  text.textContent = msg;
  if (type === 'success') {
    banner.className = 'alert alert-success';
    icon.textContent = 'check_circle';
  } else {
    banner.className = 'alert';
    icon.textContent = 'error';
  }
  banner.style.display = 'flex';
}

function hideAlert() {
  document.getElementById('alert-banner').style.display = 'none';
}

function resendCode() {
  const email = "{{ email }}";
  hideAlert();
  
  fetch("{{ url_for('resend_otp') }}", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ email: email })
  })
  .then(resp => resp.json())
  .then(data => {
    if (data.error) {
      showAlert(data.error, 'error');
    } else {
      showAlert("Verification code resent successfully!", 'success');
      // Highlight boxes and clear old values
      const boxes = document.querySelectorAll('.otp-box');
      boxes.forEach(box => box.value = '');
      if (boxes.length > 0) boxes[0].focus();
    }
  })
  .catch(err => {
    showAlert("Failed to resend code: " + err, 'error');
  });
}
</script>
</body>
</html>
