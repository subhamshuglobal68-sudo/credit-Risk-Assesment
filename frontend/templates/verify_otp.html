<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check your email - CREA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0efeb;
    --card: #ffffff;
    --text: #1d1d1d;
    --muted: #5c5c5c;
    --border: #d5d5d5;
    --teal: #007c89;
    --teal-dark: #006570;
    --yellow-strip: #ffe01b;
    --radius: 6px;
  }

  html, body {
    min-height: 100vh;
    background-color: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 5px;
    height: 100%;
    background: var(--yellow-strip);
    z-index: 100;
  }

  .topbar {
    display: flex;
    align-items: center;
    padding: 18px 40px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand-logo .logo-icon {
    width: 36px;
    height: 36px;
    background: var(--text);
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 18px;
  }

  .brand-logo .logo-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  .page-center {
    display: flex;
    justify-content: center;
    padding: 40px 24px 80px;
  }

  .auth-card {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border-radius: 12px;
    padding: 48px 52px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  .auth-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 12px;
  }

  .auth-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .auth-sub strong { color: var(--text); }

  /* OTP boxes */
  .otp-row {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }

  .otp-box {
    flex: 1;
    height: 56px;
    text-align: center;
    font-size: 24px;
    font-weight: 700;
    font-family: 'Inter', monospace;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    background: #fff;
    transition: border-color 0.2s;
  }

  .otp-box:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(0, 124, 137, 0.1);
  }

  .btn-primary {
    display: inline-block;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 13px 32px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--teal-dark); }

  .helper-row {
    margin-top: 20px;
    font-size: 14px;
    color: var(--muted);
  }

  .teal-link {
    color: var(--teal);
    text-decoration: none;
    font-weight: 500;
    cursor: pointer;
  }
  .teal-link:hover { text-decoration: underline; }

  .demo-link {
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }

  .alert-error {
    background: #fff0f0;
    border: 1.5px solid #f5c0c0;
    color: #c0392b;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: var(--radius);
    margin-bottom: 20px;
  }

  .alert-banner {
    font-size: 13px;
    padding: 12px 14px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    display: none;
  }
  .alert-banner.error {
    background: #fff0f0;
    border: 1.5px solid #f5c0c0;
    color: #c0392b;
  }
  .alert-banner.success {
    background: #f0fdf4;
    border: 1.5px solid #bbf7d0;
    color: #15803d;
  }

  .page-footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="brand-logo">
    <div class="logo-icon">⚡</div>
    <span class="logo-name">CREA AI</span>
  </a>
</div>

<div class="page-center">
  <div class="auth-card">
    <h1 class="auth-title">Check your email</h1>
    <p class="auth-sub">Enter the code sent to <strong>{{ email }}</strong></p>

    <div id="alert-banner" class="alert-banner" role="alert"></div>

    {% if error %}
    <div class="alert-error">⚠ {{ error }}</div>
    {% endif %}

    <form id="otp-form" method="POST" action="{{ url_for('verify_otp') }}">
      <input type="hidden" name="email" value="{{ email }}">
      <input type="hidden" name="action" value="{{ action }}">
      <input type="hidden" name="name" value="{{ name }}">
      <input type="hidden" id="full-code" name="code" value="">

      <div class="otp-row">
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" required>
        <input type="text" maxlength="1" class="otp-box" inputmode="numeric" pattern="[0-9]" required>
      </div>

      <button type="submit" class="btn-primary">Verify code</button>
    </form>

    <p class="helper-row">
      Can't find the email? Check your spam folder.<br><br>
      Didn't receive it? <a class="teal-link" onclick="resendCode()">Resend code</a>
    </p>

    <p class="demo-link">
      💡 <a href="{{ url_for('email_preview', email=email) }}" target="_blank" class="teal-link">[Demo] View simulated email in browser</a>
    </p>
  </div>
</div>

<div class="page-footer">
  &copy;2024 CREA AI &mdash; Credit Risk Intelligence Platform
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const boxes = document.querySelectorAll('.otp-box');
  const form = document.getElementById('otp-form');
  const codeInput = document.getElementById('full-code');

  if (boxes[0]) boxes[0].focus();

  boxes.forEach((box, i) => {
    box.addEventListener('input', e => {
      e.target.value = e.target.value.replace(/[^0-9]/g, '');
      if (e.target.value && i < boxes.length - 1) boxes[i + 1].focus();
    });
    box.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !e.target.value && i > 0) boxes[i - 1].focus();
    });
    box.addEventListener('paste', e => {
      e.preventDefault();
      const digits = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
      digits.split('').forEach((d, idx) => { if (boxes[idx]) boxes[idx].value = d; });
      const last = Math.min(digits.length, boxes.length - 1);
      boxes[last].focus();
    });
  });

  form.addEventListener('submit', e => {
    const code = [...boxes].map(b => b.value).join('');
    if (code.length !== 6) {
      e.preventDefault();
      showAlert('Please enter the full 6-digit code.', 'error');
      return;
    }
    codeInput.value = code;
  });
});

function showAlert(msg, type) {
  const el = document.getElementById('alert-banner');
  el.textContent = (type === 'error' ? '⚠ ' : '✓ ') + msg;
  el.className = 'alert-banner ' + type;
  el.style.display = 'block';
}

function resendCode() {
  fetch("{{ url_for('resend_otp') }}", {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: "{{ email }}" })
  })
  .then(r => r.json())
  .then(d => {
    if (d.error) showAlert(d.error, 'error');
    else {
      showAlert('Code resent successfully!', 'success');
      document.querySelectorAll('.otp-box').forEach(b => b.value = '');
      document.querySelectorAll('.otp-box')[0].focus();
    }
  })
  .catch(() => showAlert('Failed to resend. Try again.', 'error'));
}
</script>
</body>
</html>
