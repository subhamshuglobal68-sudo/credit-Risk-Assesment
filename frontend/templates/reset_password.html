<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password - CREA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0efeb;
    --card: #ffffff;
    --text: #1d1d1d;
    --muted: #5c5c5c;
    --border: #d5d5d5;
    --teal: #007c89;
    --teal-dark: #006570;
    --yellow-strip: #ffe01b;
    --radius: 6px;
  }
  html, body {
    min-height: 100vh;
    background-color: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 5px;
    height: 100%;
    background: var(--yellow-strip);
    z-index: 100;
  }
  .topbar { display: flex; align-items: center; padding: 18px 40px; }
  .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .brand-logo .logo-icon { width: 36px; height: 36px; object-fit: contain; }
  .brand-logo .logo-name { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; color: var(--text); }
  .page-center { display: flex; justify-content: center; padding: 40px 24px 80px; }
  .auth-card {
    width: 100%; max-width: 540px; background: var(--card); border-radius: 12px;
    padding: 48px 52px; border: 1px solid #e0e0e0; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .auth-title { font-family: 'Playfair Display', Georgia, serif; font-size: 40px; font-weight: 700; color: var(--text); line-height: 1.15; margin-bottom: 12px; }
  .auth-sub { font-size: 15px; color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
  .field-group { margin-bottom: 20px; }
  .field-label { display: block; font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .field-input {
    width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius);
    font-size: 15px; font-family: inherit; color: var(--text); background: #fff;
  }
  .field-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(0, 124, 137, 0.1); }
  .btn-primary {
    display: inline-block; background: var(--teal); color: #fff; border: none; border-radius: 100px;
    padding: 13px 32px; font-size: 16px; font-weight: 600; cursor: pointer; text-decoration: none;
  }
  .btn-primary:hover { background: var(--teal-dark); }
  .alert-error { background: #fff0f0; border: 1.5px solid #f5c0c0; color: #c0392b; font-size: 13px; padding: 12px 14px; border-radius: var(--radius); margin-bottom: 20px; }
  .page-footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="brand-logo">
    <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo-icon" alt="CREA AI Logo">
    <span class="logo-name">CREA AI</span>
  </a>
</div>

<div class="page-center">
  <div class="auth-card">
    <h1 class="auth-title">Set new password</h1>
    <p class="auth-sub">Enter the 6-digit code sent to your email and your new password.</p>

    {% if error %}
    <div class="alert-error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('reset_password_page') }}">
      <div class="field-group">
        <label class="field-label" for="email">Account Email</label>
        <input class="field-input" type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="Enter your Email">
      </div>

      <div class="field-group">
        <label class="field-label" for="code">6-Digit Verification Code</label>
        <input class="field-input" type="text" id="code" name="code" value="{{ code or '' }}" required maxlength="6" placeholder="e.g. 123456" style="font-family: monospace; letter-spacing: 2px;">
      </div>

      <div class="field-group">
        <label class="field-label" for="new_password">New Password</label>
        <input class="field-input" type="password" id="new_password" name="new_password" minlength="8" required placeholder="Min 8 characters">
      </div>

      <button type="submit" class="btn-primary">Update password</button>
    </form>
  </div>
</div>

<div class="page-footer">
  &copy;2026 CREA AI &mdash; Credit Risk Intelligence Platform
</div>
</body>
</html>
