<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - CREA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
  :root {
    --bg-light: #f3f4f6;
    --card-bg: #ffffff;
    --text-primary: #1f2937;
    --text-secondary: #4b5563;
    --text-muted: #9ca3af;
    --border-color: #e5e7eb;
    --focus-ring: #111827;
    --btn-primary: #111827;
    --btn-primary-hover: #1f2937;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    --radius: 12px;
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  
  .auth-card {
    width: 100%;
    max-width: 420px;
    background-color: var(--card-bg);
    border-radius: var(--radius);
    padding: 40px 32px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  
  .badge-icon {
    width: 48px;
    height: 48px;
    background-color: var(--bg-light);
    color: var(--btn-primary);
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin-bottom: 24px;
  }
  
  .badge-icon .material-symbols-outlined {
    font-size: 24px;
  }
  
  .auth-header {
    text-align: center;
    margin-bottom: 28px;
  }
  
  .auth-title {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
  }
  
  .auth-sub {
    font-size: 14px;
    color: var(--text-secondary);
  }
  
  .auth-form {
    width: 100%;
  }
  
  .auth-field {
    margin-bottom: 20px;
    width: 100%;
  }
  
  .auth-field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  
  .auth-field input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 15px;
    color: var(--text-primary);
    background-color: #ffffff;
    transition: border-color 0.15s ease;
  }
  
  .auth-field input:focus {
    outline: none;
    border-color: var(--focus-ring);
  }
  
  .btn {
    width: 100%;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s ease;
  }
  
  .btn-primary {
    background-color: var(--btn-primary);
    color: #ffffff;
  }
  
  .btn-primary:hover {
    background-color: var(--btn-primary-hover);
  }
  
  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 500;
    margin: 20px 0;
  }
  
  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid var(--border-color);
  }
  
  .divider:not(:empty)::before {
    margin-right: 12px;
  }
  
  .divider:not(:empty)::after {
    margin-left: 12px;
  }
  
  .btn-social {
    background-color: #ffffff;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  
  .btn-social:hover {
    background-color: #f9fafb;
    border-color: #d1d5db;
  }
  
  .btn-social svg {
    width: 18px;
    height: 18px;
  }
  
  .auth-footer {
    margin-top: 24px;
    font-size: 14px;
    color: var(--text-secondary);
    text-align: center;
  }
  
  .auth-footer a {
    color: var(--focus-ring);
    text-decoration: none;
    font-weight: 600;
  }
  
  .auth-footer a:hover {
    text-decoration: underline;
  }
  
  .alert {
    width: 100%;
    background-color: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert .material-symbols-outlined {
    font-size: 18px;
  }
  
  /* Client side alert warning style */
  #client-error {
    background-color: #fffbeb;
    border-color: #fef3c7;
    color: #b45309;
  }
</style>
</head>
<body>
<div class="auth-card">
  <div class="badge-icon">
    <span style="font-size: 24px; color: #fbbf24;">⚡</span>
  </div>
  <div class="auth-header">
    <h2 class="auth-title">Create an account</h2>
    <p class="auth-sub">Please enter your details to create an account.</p>
  </div>
  
  <!-- Client-side error display banner -->
  <div id="client-error" class="alert" style="display: none;">
    <span class="material-symbols-outlined">warning</span>
    <span id="client-error-text"></span>
  </div>

  {% if error %}
  <div class="alert">
    <span class="material-symbols-outlined">error</span>
    <span>{{ error }}</span>
  </div>
  {% endif %}
  
  <form class="auth-form" method="POST" action="{{ url_for('register') }}" onsubmit="return validateForm()">
    <div class="auth-field">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required placeholder="Enter your full name" autocomplete="name">
    </div>
    <div class="auth-field">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required placeholder="Enter your Email" autocomplete="email">
    </div>
    <button type="submit" class="btn btn-primary">Send email code</button>
  </form>
  
  <div class="divider">OR</div>
  
  <a href="{{ url_for('google_auth') }}" class="btn btn-social" style="text-decoration: none;">
    <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
    </svg>
    <span>Continue with Google</span>
  </a>
  
  <button type="button" class="btn btn-social" onclick="alert('Apple sign-in is a visual placeholder for this demo.')">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
    </svg>
    <span>Continue with Apple</span>
  </button>
  
  <div class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
  </div>
</div>

<script>
function validateForm() {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const errorDiv = document.getElementById('client-error');
  const errorText = document.getElementById('client-error-text');
  
  errorDiv.style.display = 'none';
  
  if (!name || !email) {
    showError("All fields are required");
    return false;
  }
  
  if (!email.includes('@') || !email.includes('.')) {
    showError("Please enter a valid email address");
    return false;
  }
  return true;
}

function showError(msg) {
  const errorDiv = document.getElementById('client-error');
  const errorText = document.getElementById('client-error-text');
  errorText.textContent = msg;
  errorDiv.style.display = 'flex';
}
</script>
</body>
</html>
