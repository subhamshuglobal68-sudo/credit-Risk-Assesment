<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  
  body {
    font-family: "Roboto", sans-serif;
    background-color: #f0f4f9;
    color: #1f1f1f;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  
  .google-card {
    width: 100%;
    max-width: 440px;
    background-color: #ffffff;
    border-radius: 28px;
    padding: 40px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border: 1px solid #e3e3e3;
    display: flex;
    flex-direction: column;
  }
  
  .google-logo {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  
  .google-logo svg {
    width: 32px;
    height: 32px;
  }
  
  .google-header {
    text-align: center;
    margin-bottom: 32px;
  }
  
  .google-title {
    font-size: 24px;
    font-weight: 400;
    color: #1f1f1f;
    margin-bottom: 8px;
  }
  
  .google-sub {
    font-size: 16px;
    color: #444746;
  }
  
  .account-list {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin-bottom: 24px;
  }
  
  .account-item {
    display: flex;
    align-items: center;
    padding: 16px 12px;
    border-bottom: 1px solid #e3e3e3;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  
  .account-item:hover {
    background-color: #f7f9fc;
  }
  
  .account-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background-color: #0b57d0;
    color: #ffffff;
    font-size: 16px;
    font-weight: 500;
    display: grid;
    place-items: center;
    margin-right: 12px;
  }
  
  .account-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  
  .account-name {
    font-size: 14px;
    font-weight: 500;
    color: #1f1f1f;
  }
  
  .account-email {
    font-size: 12px;
    color: #444746;
  }
  
  .custom-form {
    border-top: 1px solid #e3e3e3;
    padding-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .custom-title {
    font-size: 14px;
    font-weight: 500;
    color: #444746;
  }
  
  .input-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  
  .input-field label {
    font-size: 12px;
    font-weight: 500;
    color: #444746;
  }
  
  .input-field input {
    width: 100%;
    padding: 12px;
    border: 1px solid #747775;
    border-radius: 4px;
    font-size: 14px;
    color: #1f1f1f;
    outline: none;
  }
  
  .input-field input:focus {
    border-color: #0b57d0;
    border-width: 2px;
    padding: 11px;
  }
  
  .btn-submit {
    background-color: #0b57d0;
    color: #ffffff;
    border: none;
    border-radius: 100px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    align-self: flex-end;
    transition: background-color 0.15s ease;
  }
  
  .btn-submit:hover {
    background-color: #0842a0;
  }
</style>
</head>
<body>
<div class="google-card">
  <div class="google-logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
    </svg>
  </div>
  
  <div class="google-header">
    <h2 class="google-title">Choose an account</h2>
    <p class="google-sub">to continue to <strong>CREA AI</strong></p>
  </div>
  
  <!-- Account selection list -->
  <div class="account-list">
    <div class="account-item" onclick="selectAccount('Subham Shu', 'subha@gmail.com')">
      <div class="account-avatar" style="background-color: #0b57d0;">S</div>
      <div class="account-info">
        <span class="account-name">Subham Shu</span>
        <span class="account-email">subha@gmail.com</span>
      </div>
    </div>
    
    <div class="account-item" onclick="selectAccount('Crea Admin', 'admin@crea.ai')">
      <div class="account-avatar" style="background-color: #b3261e;">C</div>
      <div class="account-info">
        <span class="account-name">Crea Admin</span>
        <span class="account-email">admin@crea.ai</span>
      </div>
    </div>
    
    <div class="account-item" onclick="selectAccount('Demo User', 'demo@crea.ai')">
      <div class="account-avatar" style="background-color: #128c7e;">D</div>
      <div class="account-info">
        <span class="account-name">Demo User</span>
        <span class="account-email">demo@crea.ai</span>
      </div>
    </div>
  </div>
  
  <!-- Use custom details form -->
  <form class="custom-form" action="{{ url_for('google_auth_callback') }}" method="GET">
    <h3 class="custom-title">Use another account</h3>
    <div class="input-field">
      <label for="custom-name">Full Name</label>
      <input type="text" id="custom-name" name="name" required placeholder="Your Name">
    </div>
    <div class="input-field">
      <label for="custom-email">Email Address</label>
      <input type="email" id="custom-email" name="email" required placeholder="name@domain.com">
    </div>
    <button type="submit" class="btn-submit">Continue</button>
  </form>
</div>

<script>
function selectAccount(name, email) {
  const url = "{{ url_for('google_auth_callback') }}?name=" + encodeURIComponent(name) + "&email=" + encodeURIComponent(email);
  window.location.href = url;
}
</script>
</body>
</html>
