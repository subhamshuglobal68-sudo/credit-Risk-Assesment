<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - CREA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0efeb;
    --card: #ffffff;
    --text: #1d1d1d;
    --muted: #5c5c5c;
    --border: #d5d5d5;
    --teal: #007c89;
    --teal-dark: #006570;
    --teal-light: #e6f4f5;
    --yellow-strip: #ffe01b;
    --radius: 6px;
  }

  html, body {
    min-height: 100vh;
    background-color: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
  }

  /* Yellow left strip like Mailchimp */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 5px;
    height: 100%;
    background: var(--yellow-strip);
    z-index: 100;
  }

  /* Top bar with logo */
  .topbar {
    display: flex;
    align-items: center;
    padding: 18px 40px;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
  }

  .brand-logo .logo-icon {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }

  .brand-logo .logo-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }

  /* Page layout */
  .page-center {
    display: flex;
    justify-content: center;
    padding: 40px 24px 80px;
  }

  /* Card */
  .auth-card {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border-radius: 12px;
    padding: 48px 52px;
    border: 1px solid #e0e0e0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }

  /* Heading */
  .auth-title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 40px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.15;
    margin-bottom: 12px;
  }

  .auth-sub {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 32px;
    line-height: 1.5;
  }

  .auth-sub a {
    color: var(--teal);
    text-decoration: none;
    font-weight: 500;
  }
  .auth-sub a:hover { text-decoration: underline; }

  /* Form */
  .field-group {
    margin-bottom: 20px;
  }

  .field-label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .field-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: #fff;
    transition: border-color 0.2s;
    line-height: 1.5;
  }
  .field-input:focus {
    outline: none;
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(0, 124, 137, 0.1);
  }

  /* Button */
  .btn-primary {
    display: inline-block;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 100px;
    padding: 13px 32px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
    text-decoration: none;
  }
  .btn-primary:hover { background: var(--teal-dark); }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 28px 0;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Social buttons */
  .btn-social {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
    text-decoration: none;
    margin-bottom: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-social:hover { background: #f7f7f7; border-color: #bbb; }
  .btn-social svg { flex-shrink: 0; }

  /* Teal links */
  .teal-links {
    margin-top: 24px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .teal-link {
    color: var(--teal);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }
  .teal-link:hover { text-decoration: underline; }

  /* Error */
  .alert-error {
    background: #fff0f0;
    border: 1.5px solid #f5c0c0;
    color: #c0392b;
    font-size: 13px;
    padding: 12px 14px;
    border-radius: var(--radius);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Footer */
  .page-footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--muted);
  }
  .page-footer a { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/" class="brand-logo">
    <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo-icon" alt="CREA AI Logo">
    <span class="logo-name">CREA AI</span>
  </a>
</div>

<div class="page-center">
  <div class="auth-card">
    <h1 class="auth-title">Log in</h1>
    <p class="auth-sub">Need a CREA AI account? <a href="{{ url_for('register') }}">Create an account</a></p>

    {% if error %}
    <div class="alert-error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="field-group">
        <label class="field-label" for="email">Email</label>
        <input class="field-input" type="email" id="email" name="email" required placeholder="Enter your Email" autocomplete="email">
      </div>

      <button type="submit" class="btn-primary">Log in</button>
    </form>

    <div class="divider">OR</div>

    <a href="{{ url_for('google_auth') }}" class="btn-social">
      <svg width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </a>

    <button type="button" class="btn-social" onclick="alert('Apple sign-in coming soon.')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.21.67-2.93 1.49-.62.69-1.16 1.84-1.01 2.96 1.12.09 2.27-.57 2.95-1.39z"/>
      </svg>
      Continue with Apple
    </button>
  </div>
</div>

<div class="page-footer">
  &copy;2024 CREA AI &mdash; Credit Risk Intelligence Platform
</div>
</body>
</html>
