version: '3.8'

services:
  # Python ML Backend (Port 5000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_DEBUG=0
    restart: unless-stopped

  # Node.js Auth Server (Port 5002)
  auth-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - FRONTEND_URL=http://localhost:5173
    restart: unless-stopped

  # Flask Frontend Proxy & UI (Port 5001)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - HOST=0.0.0.0
      - BACKEND_URL=http://backend:5000
      - AUTH_URL=http://auth-server:5002
    depends_on:
      - backend
      - auth-server
    restart: unless-stopped

  # React Vite Client (Port 5173)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    restart: unless-stopped
